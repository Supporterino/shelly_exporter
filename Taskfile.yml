version: "3"

tasks:
  build:
    desc: Build the exporter binary
    cmds:
      - go build -o bin/shelly_exporter ./cmd/exporter

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  run:
    desc: Run the exporter
    cmds:
      - go run ./cmd/exporter
